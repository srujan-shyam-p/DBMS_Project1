<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
</head>
<body>

<h2>Available Courses</h2>

<table border="1">
    <tr>
        <th>Course Name</th>
        <th>Price</th>
    </tr>

    {% for c in courses %}
    <tr>
        <td>{{ c[0] }}</td>
        <td>{{ c[1] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
