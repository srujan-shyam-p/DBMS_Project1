{% extends "base_dashboard.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<h2 class="section-title">My Profile</h2>

<div
    style="background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 600px;">
    <div style="margin-bottom: 20px;">
        <label style="font-weight: bold; color: #666; font-size: 14px; display: block; margin-bottom: 5px;">Full
            Name</label>
        <div style="font-size: 18px;">{{ user.name }}</div>
    </div>

    <div style="margin-bottom: 20px;">
        <label
            style="font-weight: bold; color: #666; font-size: 14px; display: block; margin-bottom: 5px;">Email</label>
        <div style="font-size: 18px;">{{ user.email }}</div>
    </div>

    <div style="margin-bottom: 20px;">
        <label style="font-weight: bold; color: #666; font-size: 14px; display: block; margin-bottom: 5px;">Phone
            Number</label>
        <div style="font-size: 18px;">{{ user.phonenumber or 'Not set' }}</div>
    </div>

    <div style="margin-bottom: 20px;">
        <label style="font-weight: bold; color: #666; font-size: 14px; display: block; margin-bottom: 5px;">Role</label>
        <div style="font-size: 18px; text-transform: capitalize;">{{ session['role'] }}</div>
    </div>
</div>
{% endblock %}
